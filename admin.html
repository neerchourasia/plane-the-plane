<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plane the Plane · Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --bg: #0b1020; --card: #101a2b; --line: #2a3d5c; --text: #e8fff5; --muted: #8fa8c8; --accent: #3ddc97; --ink: #06201a; --bad: #ff8a8a; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-monospace, Menlo, Consolas, monospace; min-height: 100vh; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; margin: 10px 0; }
  input { font: inherit; background: #0b1424; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 320px; }
  button { background: var(--accent); color: var(--ink); border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; margin: 4px 6px 0 0; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  a { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .wrap { overflow-x: auto; }
  .hint { color: var(--muted); font-size: 13px; }
  .err { color: var(--bad); font-size: 13px; min-height: 1em; }
  .hidden { display: none; }
  @media (max-width: 600px) { th, td { font-size: 12px; padding: 4px; } }
</style>
</head>
<body>
<main>
  <h1>Plane the Plane · Admin</h1>
  <p class="sub">Every pilot who has signed up, from any browser.</p>

  <section id="gate" class="card">
    <p class="hint">Sign in as the admin pilot, human.</p>
    <label>Pilot name <input id="name" value="human" autocomplete="username" readonly></label>
    <label>Password <input id="pass" type="password" autocomplete="current-password"></label>
    <button id="enter">Sign in</button>
    <p class="err" id="err"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="card">
      <p class="hint" id="count"></p>
      <p class="err" id="loadErr"></p>
      <div class="wrap">
        <table>
          <thead><tr><th>Pilot</th><th>Signed up</th><th>Last sign-in</th><th>Level</th><th>Coins</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <button id="refresh" class="ghost">Refresh</button>
      <button id="signout" class="ghost">Sign out</button>
      <a href="index.html">Back to the game</a>
    </div>
  </section>
</main>
<script>
// The admin list comes from the server. Only the admin pilot's sign-in works, and the token lasts for this tab.
const TOKEN_KEY = 'plane-the-plane-admin-token';
const $ = id => document.getElementById(id);
const when = iso => iso ? new Date(iso).toLocaleString() : 'never';

async function api(path, { method = 'GET', body, token = '' } = {}) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Something went wrong.'); e.status = res.status; throw e; }
  return data;
}

async function enter() {
  const err = $('err');
  err.textContent = '';
  try {
    const data = await api('/api/login', { method: 'POST', body: { name: 'human', password: $('pass').value } });
    if (data.name !== 'human') { err.textContent = 'Only the admin pilot can open this page.'; return; }
    try { sessionStorage.setItem(TOKEN_KEY, data.token); } catch (e) { /* storage blocked */ }
    $('pass').value = '';
    $('gate').classList.add('hidden');
    $('panel').classList.remove('hidden');
    render();
  } catch (e) {
    err.textContent = e.status ? e.message : "Can't reach the server. Check your wifi and try again.";
  }
}

// removes a pilot and their save from the server, after a confirmation
async function removePilot(name) {
  if (!confirm(`Delete ${name} and their save? This cannot be undone.`)) return;
  const token = (() => { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } })();
  try {
    await api('/api/delete', { method: 'POST', body: { name }, token });
    render();
  } catch (e) {
    $('loadErr').textContent = e.message || "Couldn't delete the pilot.";
  }
}

async function render() {
  const token = (() => { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } })();
  $('loadErr').textContent = '';
  try {
    const { pilots } = await api('/api/admin', { token });
    const rows = $('rows');
    rows.innerHTML = '';
    for (const p of pilots) {
      const tr = document.createElement('tr');
      for (const v of [p.name, when(p.created), when(p.lastSignIn), 1 + Math.floor((p.xp || 0) / 500), p.coins ?? '-']) {
        const td = document.createElement('td');
        td.textContent = v;
        tr.append(td);
      }
      const del = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'ghost';
      btn.textContent = 'Delete';
      btn.onclick = () => removePilot(p.name);
      del.append(btn);
      tr.append(del);
      rows.append(tr);
    }
    $('count').textContent = `${pilots.length} pilot${pilots.length === 1 ? '' : 's'} signed up.`;
  } catch (e) {
    $('loadErr').textContent = e.status === 403 || e.status === 401 ? 'Sign in again as human.' : (e.message || "Couldn't load the list.");
  }
}

$('enter').onclick = enter;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('refresh').onclick = render;
$('signout').onclick = () => { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* storage blocked */ } location.reload(); };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
